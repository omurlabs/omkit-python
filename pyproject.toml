[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omkit"
version = "0.1.0"
description = "Multi-tenant SaaS scaffolding for Python services."
requires-python = ">=3.12"
authors = [{name = "Omur Labs"}]
readme = "README.md"
license = "Apache-2.0"
urls = {Homepage = "https://github.com/omurlabs/omkit-python", Repository = "https://github.com/omurlabs/omkit-python", Issues = "https://github.com/omurlabs/omkit-python/issues"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "asyncpg>=0.31",
    "redis>=7.4",
    "structlog>=25.5",
    "cryptography>=47.0",
    "tenacity>=9.1",
    "prometheus_client>=0.25",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.136.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "redis>=7.4",
    "respx>=0.21",
    "mypy>=1.13",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
]
tracing = [
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-instrumentation-httpx>=0.62b0",
]
metrics = [
    "prometheus-fastapi-instrumentator>=7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omkit*"]

[tool.setuptools.package-data]
omkit = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
files = ["omkit"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
# `strict = true` is aspirational. The codebase ships `py.typed` but predates
# strict typing; tighten gradually rather than blocking on a full annotation
# pass.

[[tool.mypy.overrides]]
module = [
    "structlog",
    "structlog.*",
    "prometheus_client",
    "prometheus_client.*",
    "redis",
    "redis.*",
    "asyncpg",
    "asyncpg.*",
    "httpx",
    "streaq",
    "streaq.*",
    "fastapi",
    "fastapi.*",
    "opentelemetry.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "pydantic",
    "pydantic_settings",
    "cryptography.*",
    "tenacity",
    "prometheus_fastapi_instrumentator",
]
ignore_missing_imports = true
