[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omur-sdk"
version = "0.2.0"
description = "Shared provider framework for Omur services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "asyncpg>=0.31",
    "redis>=7.4",
    "structlog>=25.5",
    "cryptography>=46.0",
    "tenacity>=9.1",
    "prometheus_client>=0.25",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "redis>=7.4",
]
tracing = [
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp-proto-http>=1.41.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-instrumentation-httpx>=0.62b0",
]
metrics = [
    "prometheus-fastapi-instrumentator>=7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omur_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
