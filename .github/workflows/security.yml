name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:00 UTC — catches newly-disclosed vulns even when no PR lands.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pip-audit
        # Renovate-tracked via customManagers in renovate.json.
        run: pip install pip-audit==2.9.0

      - name: Audit declared dependencies (pyproject.toml)
        # Auto-detects pyproject.toml in the working dir and resolves via pip.
        # --strict makes the action fail when audit cannot resolve a dep
        # (e.g. yanked release), not just when vulns are found.
        run: pip-audit --strict --progress-spinner=off

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # gitleaks-action@v2 requires a paid license for orgs; install
      # the binary via the shared composite action centralised in
      # omurlabs/.github. Version pin lives there; one Renovate bump
      # rolls all consumer repos.
      - uses: omurlabs/.github/.github/actions/install-gitleaks@28ced76bd5d24f95e4c7b75b981e1f52c69c2a2a  # main

      - name: Gitleaks scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LOG_OPTS=""
          else
            LOG_OPTS="HEAD~1..HEAD"
          fi
          gitleaks detect --source . \
                          --config .gitleaks.toml \
                          ${LOG_OPTS:+--log-opts="$LOG_OPTS"} \
                          --redact \
                          --verbose
