name: pypi-publish

# Publishes the omkit wheel + sdist to PyPI on `v*` tag pushes via
# Trusted Publishing (OIDC) — no PyPI token stored as a GitHub secret.
#
# REGISTRATION (one-time per environment, done by the maintainer):
#   - Real PyPI       : https://pypi.org/manage/project/omkit/settings/publishing/
#                       repo: omurlabs/omkit-python
#                       workflow: pypi-publish.yml
#                       environment: pypi
#   - TestPyPI        : https://test.pypi.org/manage/project/omkit/settings/publishing/
#                       repo: omurlabs/omkit-python
#                       workflow: pypi-publish.yml
#                       environment: testpypi
#
# Until both publishers are registered, the workflow will fail at the
# upload step (build + artefact upload still succeed; useful for a
# dry-run sanity check on tag-trigger before the PyPI side is wired).
#
# Manual trigger: `Actions → pypi-publish → Run workflow` and pick the
# `target` input (testpypi by default). Use this to validate the build
# end-to-end against TestPyPI before tagging a real release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "PyPI index to publish to"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (sdist + wheel)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          # Self-hosted runner bind-mounts PIP_CACHE_DIR from Unraid; skip
          # GHA-backed pip cache to avoid redundant cache restore.
      - name: Install build backend
        run: pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify wheel and sdist contents
        run: |
          set -euo pipefail
          ls -la dist/
          for whl in dist/*.whl; do
            duplicates=$(unzip -l "$whl" | awk '{print $4}' | sort | uniq -d | grep -v '^$' || true)
            if [ -n "$duplicates" ]; then
              echo "::error::Duplicate entries in $whl:"
              echo "$duplicates"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: omkit-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: publish (testpypi)
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') ||
      (github.event_name == 'push' && contains(github.ref, '-rc'))
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/omkit/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: omkit-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish (pypi)
    needs: build
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc'))
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/omkit/
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: omkit-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
