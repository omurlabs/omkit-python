name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + mypy (py${{ matrix.python-version }})
    runs-on: self-hosted
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omkit
          POSTGRES_PASSWORD: omkit
          POSTGRES_DB: omkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_DSN: postgres://omkit:omkit@127.0.0.1:5432/omkit
      TEST_REDIS_ADDR: 127.0.0.1:6379
      VALKEY_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tracing,metrics]"

      - name: wait for services
        # The `services:` block waits for the docker --health-cmd to pass
        # before launching steps, but on the self-hosted runner we've seen
        # tests start while Postgres is still listening only on the
        # container network (host port 5432 not yet bound). Explicitly
        # poll the host port so we fail fast with a clear error instead
        # of dozens of `ConnectionRefusedError [Errno 111]` inside pytest.
        run: |
          set -e
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1 && pg_ok=1 && break
            sleep 1
          done
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/6379) >/dev/null 2>&1 && redis_ok=1 && break
            sleep 1
          done
          if [ -z "$pg_ok" ]; then
            echo "::error::postgres host port 5432 never opened after 30s" >&2
            exit 1
          fi
          if [ -z "$redis_ok" ]; then
            echo "::error::valkey host port 6379 never opened after 30s" >&2
            exit 1
          fi
          echo "services reachable: postgres:5432, valkey:6379"

      - name: pytest
        run: >-
          pytest -v --tb=short
          --cov=omkit --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: mypy
        run: mypy omkit
