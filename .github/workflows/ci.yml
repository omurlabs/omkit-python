name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR runs only the newest supported Python (fast feedback). Full matrix
  # fires on push-to-main + workflow_dispatch so a 3.12-only regression
  # cannot reach a tagged release. 3.12 is the minimum supported per
  # `requires-python = ">=3.12"` in pyproject.toml.
  matrix-config:
    name: matrix config
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      pythons: ${{ steps.set.outputs.pythons }}
    steps:
      - id: set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo 'pythons=["3.14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'pythons=["3.12","3.14"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: pytest + mypy (py${{ matrix.python-version }})
    needs: matrix-config
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix-config.outputs.pythons) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # uv is ~10-100x faster than pip for resolve + install. Its on-disk
      # cache is keyed per-dependency hash, so a one-line pyproject.toml
      # edit no longer invalidates every wheel.
      #
      # `enable-cache: true` — on GitHub-hosted runners there is no warm
      # local uv cache, so the GHA-backed cache layer is what makes repeat
      # runs fast. (It was disabled while this job ran on the self-hosted
      # fleet, which bind-mounted UV_CACHE_DIR from the Unraid host.)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Per-job venv (NOT --system) — keeps each matrix leg's site-packages
      # isolated, so a resolution difference between 3.12 and 3.14 cannot
      # leak across legs.
      - name: install
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python -e ".[dev,tracing,metrics]"

      - name: pytest
        run: >-
          .venv/bin/pytest -v --tb=short
          --cov=omkit --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: mypy
        run: .venv/bin/mypy omkit
