name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR runs only the newest supported Python (fast feedback). Full matrix
  # fires on push-to-main + workflow_dispatch so a 3.12-only regression
  # cannot reach a tagged release. 3.12 is the minimum supported per
  # `requires-python = ">=3.12"` in pyproject.toml.
  matrix-config:
    name: matrix config
    runs-on: self-hosted
    timeout-minutes: 1
    outputs:
      pythons: ${{ steps.set.outputs.pythons }}
    steps:
      - id: set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo 'pythons=["3.14"]' >> "$GITHUB_OUTPUT"
          else
            echo 'pythons=["3.12","3.14"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: pytest + mypy (py${{ matrix.python-version }})
    needs: matrix-config
    runs-on: self-hosted
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.matrix-config.outputs.pythons) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # uv is ~10-100x faster than pip for resolve + install. Its on-disk
      # cache is keyed per-dependency hash, so a one-line pyproject.toml
      # edit no longer invalidates every wheel.
      #
      # `enable-cache: false` — self-hosted runner bind-mounts UV_CACHE_DIR
      # (/home/runner/.cache/uv) from the Unraid host. setup-uv's GHA-backed
      # cache layer would redundantly pull a multi-GB cache over the
      # residential pipe before uv could start. The local mount is faster
      # and survives ephemeral container teardown.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      # Per-job venv (NOT --system) — concurrent matrix legs on shared
      # self-hosted runners with a bind-mounted /opt/hostedtoolcache
      # would race when both install into the same site-packages,
      # producing partially-broken installs (e.g. pytest-cov entry
      # points missing). A workspace-local .venv isolates each leg.
      - name: install
        run: |
          uv venv .venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python -e ".[dev,tracing,metrics]"

      - name: pytest
        run: >-
          .venv/bin/pytest -v --tb=short
          --cov=omkit --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: mypy
        run: .venv/bin/mypy omkit
